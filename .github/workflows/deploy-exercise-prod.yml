name: Deploy Exercise Service (Production)

# Every push to main deploys the exercise service to Railway (project mychampions-prod): the `exercise` API and
# the `exercise-catalog-sync` cron (same image, runs the Redis -> Postgres catalog snapshot every 15 minutes).
# "Run workflow" redeploys main by hand. The DigitalOcean VM deploy was retired on 2026-10-07 (ET-250).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: exerciseservice-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_PROJECT_TOKEN }}
      RAILWAY_CLI_VERSION: 5.63.3
      RAILWAY_ENVIRONMENT: production
      HEALTH_URL: https://exerciseservice.eduwaldo.com/health
    steps:
      - name: Verify request
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Production deploys run from main only" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_PROD_PROJECT_TOKEN secret must be configured for the production environment" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Deploy exercise
        env:
          RAILWAY_HTTP_TIMEOUT: "900"
        run: railway up --ci --service exercise --environment "$RAILWAY_ENVIRONMENT"

      - name: Deploy exercise-catalog-sync
        env:
          RAILWAY_HTTP_TIMEOUT: "900"
        run: railway up --ci --service exercise-catalog-sync --environment "$RAILWAY_ENVIRONMENT"

      # The public URL keeps answering from the previous deployment while a new one fails its health check,
      # so the run checks Railway's own status for the deployment it just created.
      - name: Confirm new deployments
        run: |
          for service in exercise exercise-catalog-sync; do
            for attempt in $(seq 1 60); do
              status="$(railway deployment list --service "$service" --environment "$RAILWAY_ENVIRONMENT" --json \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["status"])')"
              case "$status" in
                SUCCESS) echo "$service: $status"; break ;;
                FAILED|CRASHED|REMOVED) echo "::error::$service deployment $status"; exit 1 ;;
              esac
              sleep 10
            done
            if [ "$status" != SUCCESS ]; then
              echo "::error::$service deployment still $status"
              exit 1
            fi
          done

      - name: Health check
        run: |
          body="$(curl -fsS --max-time 20 "$HEALTH_URL")"
          echo "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
