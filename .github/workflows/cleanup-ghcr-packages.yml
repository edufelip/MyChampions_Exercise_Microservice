name: Cleanup GHCR Packages

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete old/untagged package versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete untagged versions older than 7 days
        uses: actions/delete-package-versions@v5
        with:
          package-name: mychampions_exercise_microservice
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          older-than: 7 days

      - name: Prune tagged versions beyond the last 10
        uses: actions/delete-package-versions@v5
        with:
          package-name: mychampions_exercise_microservice
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
